<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 Wi-Fi and MQTT flow</title>
  <desc id="desc">Connect to Wi-Fi and the MQTT broker, then subscribe to the topic. If subscription fails, reconnect. Toggle the LED and publish an MQTT message, then toggle and publish again every two seconds.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52525b" />
    </marker>
  </defs>
  <g fill="#eef2ff" stroke="#818cf8" stroke-width="1.5">
    <rect x="10" y="90" width="180" height="70" rx="6" />
    <rect x="240" y="90" width="140" height="70" rx="6" />
    <rect x="440" y="90" width="110" height="70" rx="6" />
    <rect x="600" y="90" width="150" height="70" rx="6" />
  </g>
  <g fill="none" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M 190 125 H 240" />
    <path d="M 380 125 H 440" />
    <path d="M 550 125 H 600" />
    <path d="M 310 90 V 40 H 100 V 90" />
    <path d="M 675 160 V 210 H 495 V 160" />
  </g>
  <g fill="#27272a" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">
    <text x="100" y="119">Connect to Wifi &amp;<tspan x="100" dy="24">MQTT Broker</tspan></text>
    <text x="310" y="119">Subscribe<tspan x="310" dy="24">to topic</tspan></text>
    <text x="495" y="131">LED toggle</text>
    <text x="675" y="119">Publish MQTT<tspan x="675" dy="24">Message</tspan></text>
    <text x="205" y="30">failed</text>
    <text x="585" y="199">2 sec</text>
  </g>
</svg>
